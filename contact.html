<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront | Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">StoreBrand</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="max-width: 600px;">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Get in Touch</h2>
        
        <div id="status-message" style="display: none; padding: 1rem; background-color: #d1fae5; color: #065f46; border-radius: 5px; margin-bottom: 1rem; text-align: center;">
            Thank you for your message! We will get back to you shortly.
        </div>

        <form id="contact-form" style="background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" required placeholder="How can we help you?"></textarea>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Send Message</button>
        </form>
    </main>

    <footer>
        <p>© 2026 StoreBrand. All rights reserved.</p>
    </footer>

    <script>
        const contactForm = document.getElementById('contact-form');
        const statusMessage = document.getElementById('status-message');

        contactForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Prevents actual page reload
            
            // Show confirmation message
            statusMessage.style.display = 'block';
            
            // Reset form inputs
            contactForm.reset();
        });
    </script>

</body>
</html>
